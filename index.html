<style>
:root{--bg:#0e3532;--bg2:#0a2523;--gold:#c9a24b;--rose:#8e2a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 0,var(--bg),var(--bg2));font-family:Mulish,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:min(94vw,440px);height:min(90vh,780px);position:relative;perspective:1600px}
.pgw{position:absolute;inset:0;background:var(--pbg);border-radius:6px 18px 18px 6px;border:2px solid var(--acc);overflow:hidden;transform-origin:left center;transition:transform .9s cubic-bezier(.6,.05,.25,1),opacity .6s;backface-visibility:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.pgw.gone{transform:rotateY(-105deg);opacity:0;pointer-events:none}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.t-mehndi{--pbg:#fbefd3;--acc:#2e8b57;--hi:#c2185b;--ink:#3b2a30;--cur:#8b1d52}

.t-walima{--pbg:#dde2df;--acc:#9b7b45;--hi:#1f3f78;--ink:#26323f;--cur:#1c3563}
.t-loc{--pbg:#fffdfb;--acc:#c9a24b;--hi:#a8325a;--ink:#4a3540}
.sheet{position:relative;min-height:100%;padding:40px 30px 90px;text-align:center;color:var(--ink)}
.t-loc .sheet{padding-bottom:150px}
.decor{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.content{position:relative;z-index:2}
.script{font-family:'Great Vibes',cursive;color:var(--hi)}
.ttl{font-size:2.5rem;line-height:1.1;margin:4px 0 10px;color:var(--acc)}
.ur{font-family:'Noto Nastaliq Urdu',serif;line-height:2.1;color:var(--acc);font-size:1.15rem}

.prop{position:absolute}.prop svg{width:100%;height:auto;display:block}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}

.tw{animation:fadep 1.6s ease-in-out infinite}

.lv{position:absolute;top:0;left:0;width:100%}
.lan{position:absolute;top:0;width:34px;transform-origin:top center;animation:sway 3.5s ease-in-out infinite alternate}

.water{position:absolute;bottom:0;left:0;width:100%;height:130px}
.dk{animation:bob 3s ease-in-out infinite}

.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.4}.dots i.on{opacity:1}

.pgw.act .rv{opacity:1;transform:none;transition:opacity .8s,transform .8s;transition-delay:calc(var(--i)*.13s + 1s)}
.curtain{position:absolute;inset:0;z-index:10;cursor:pointer;overflow:hidden}
.cl,.cr{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 7px,rgba(255,255,255,.08) 7px 16px),var(--cur);box-shadow:inset 0 -12px 0 #d9b45a;transition:transform 1.6s cubic-bezier(.65,0,.3,1)}
.cl{left:0;transform-origin:left}.cr{right:0;transform-origin:right}
.rod{position:absolute;top:8px;left:0;right:0;height:10px;background:linear-gradient(#f3d98b,#9b7b45);border-radius:6px;z-index:2}
.clab{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f3d98b;padding:0 30px;transition:opacity .6s;pointer-events:none}
.clab .script{color:#f3d98b;font-size:3.8rem;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.clab .ur{color:#f3d98b;font-size:2.6rem}
.clab .sub{color:#fff;font-size:1.05rem;margin-top:8px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.tap{margin-top:26px;padding:8px 20px;border:1px solid #f3d98b;border-radius:30px;font-weight:600;animation:fadep 1.6s ease-in-out infinite}
.pgw.open .cl,.pgw.open .cr{transform:scaleX(.16)}
.pgw.open .clab{opacity:0}.pgw.open .curtain{pointer-events:none}
.petal{position:fixed;top:-30px;z-index:20;pointer-events:none;border-radius:0 100% 0 100%;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(540deg)}}
.clab .ur.bs{font-size:1.5rem;line-height:1.9}
.cv-s{font:italic 500 1.5rem 'Cormorant Garamond',serif;margin:2px 0 6px}
.clab .cv-n{font-size:3.4rem}
.cv-w{font:italic 1.4rem 'Cormorant Garamond',serif;color:#fff;margin:-4px 0}
.cv-ev{margin-top:14px;padding-top:12px;border-top:1px solid rgba(243,217,139,.5);font-size:.88rem;line-height:1.7;color:#fff}.cv-ev b{color:#f3d98b}
.curtain .strand,.curtain .bl{z-index:2;pointer-events:none}.curtain .clab{z-index:3}
.fw{position:fixed;top:-40px;z-index:40;pointer-events:none;animation:fall linear infinite;opacity:.92}
@media (prefers-reduced-motion:reduce){.pgw{transition:opacity .3s}.pgw.gone{transform:none}.rv{opacity:1;transform:none}.petal,.fw{display:none}*{animation:none!important}}
</style>
</head>
